spring.application.name=turnos-manicura
# Valores para correr local; en Docker los pisan las variables SPRING_DATASOURCE_*
spring.datasource.url=jdbc:mysql://localhost:3308/TURNOS
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Devuelve el mensaje de error al frontend (ej: "La manicurista ya tiene un turno en ese horario")
server.error.include-message=always
