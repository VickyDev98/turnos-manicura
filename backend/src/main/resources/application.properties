spring.application.name=turnos-manicura
# Local: definir DB_PASSWORD (y opcionalmente DB_URL, DB_USER). En Docker los pisan las variables SPRING_DATASOURCE_*
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/TURNOS}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Devuelve el mensaje de error al frontend (ej: "La manicurista ya tiene un turno en ese horario")
server.error.include-message=always

# Minutos de inactividad tras los cuales se cierra la sesión
app.sesion.minutos-inactividad=480
