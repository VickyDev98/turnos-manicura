spring.application.name=turnos-manicura
# Local: definir DB_PASSWORD (y opcionalmente DB_URL, DB_USER). En Docker los pisan las variables SPRING_DATASOURCE_*
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/TURNOS}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none

# El esquema lo crean las migraciones de db/migration (Flyway las aplica al arrancar, solo las que faltan).
# Por defecto NO se cargan datos de prueba; docker-compose agrega classpath:db/datos-prueba con FLYWAY_LOCATIONS
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Devuelve el mensaje de error al frontend (ej: "La manicurista ya tiene un turno en ese horario")
server.error.include-message=always

# Minutos de inactividad tras los cuales se cierra la sesión
app.sesion.minutos-inactividad=480

# Avisos por mail. Sin spring.mail.host no se manda nada (solo queda un renglón en el log).
# Local: definir SMTP_HOST (y SMTP_PORT, SMTP_USER, SMTP_PASSWORD si el servidor las pide)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.notificaciones.remitente=${SMTP_REMITENTE:turnos@manicura.local}

# Recordatorio al cliente: cuántas horas antes del turno y cada cuántos minutos se revisa
app.recordatorios.horas-antes=24
app.recordatorios.intervalo-minutos=15

# Anticipación mínima (en horas) para que un cliente cancele o reprograme su turno. 0 = sin límite.
# La manicurista y el admin pueden siempre
app.turnos.horas-minimas-cancelacion=24
