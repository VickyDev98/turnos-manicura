# Perfil "test": se activa con @ActiveProfiles("test") y pisa lo de application.properties.
# Base H2 en memoria que imita a MySQL; desaparece al terminar los tests.
# DB_CLOSE_DELAY=-1: la base vive mientras viva la JVM (si no, se borra al cerrar la primera conexión)
spring.datasource.url=jdbc:h2:mem:turnos_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# En producción el esquema sale de scripts/Turnos.sql (ddl-auto=none). Acá Hibernate crea las tablas
# a partir de las entidades al arrancar y las borra al cerrar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
