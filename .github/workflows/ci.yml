name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # Todos los tests: los unitarios usan Mockito y los de integración una base H2 en memoria (no hace falta MySQL)
      - run: chmod +x mvnw && ./mvnw -B test
