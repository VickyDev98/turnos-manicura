# Levanta todo el sistema: docker compose up --build
#   Frontend: http://localhost:3000
#   Backend:  http://localhost:8080
#   MySQL:    localhost:3309 (usuario root, clave en secrets/mysql_root_password.txt)
#
# Las claves (MySQL, JWT, SMTP) NO van en variables de entorno: viven como archivos en secrets/ y Docker los monta
# de solo lectura en /run/secrets/ de cada contenedor. Primera vez: scripts\generar-secretos.ps1 (ver README).
services:
  mysql:
    image: mysql:8
    environment:
      # La imagen de MySQL lee la clave root del archivo que indica la variable *_FILE
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      # Crea la base vacía; las tablas las crea Flyway desde el backend
      MYSQL_DATABASE: TURNOS
    secrets:
      - mysql_root_password
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP) y no el socket: el servidor temporal de arranque no acepta TCP,
      # así no se marca "healthy" antes de que termine la inicialización de MySQL.
      # La clave se lee del archivo dentro del contenedor ($$ evita que Compose interprete el $)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$(cat /run/secrets/mysql_root_password)\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/TURNOS
      SPRING_DATASOURCE_USERNAME: root
      # Migraciones + datos de prueba (usuarios con clave 123456, etc.). Para una base real, dejar solo db/migration
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/datos-prueba
      # Avisos por mail: vacío = no se manda nada. Ver .env.example (la clave SMTP va en secrets/smtp_password.txt)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-turnos@manicura.local}
    # El nombre del archivo en /run/secrets/ (target) es la propiedad que Spring Boot completa
    # (spring.config.import=configtree: en application.properties): DB_PASSWORD, JWT_SECRET y SMTP_PASSWORD
    secrets:
      - source: mysql_root_password
        target: DB_PASSWORD
      - source: jwt_secret
        target: JWT_SECRET
      - source: smtp_password
        target: SMTP_PASSWORD
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Casilla de correo de prueba: atrapa los mails sin mandarlos a nadie. Solo con: docker compose --profile correo up
  #   Bandeja: http://localhost:8025 (poné SMTP_HOST=mailpit y SMTP_PORT=1025 en .env)
  mailpit:
    image: axllent/mailpit
    profiles: ["correo"]
    ports:
      - "8025:8025"

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  smtp_password:
    file: ./secrets/smtp_password.txt

volumes:
  mysql_data:
