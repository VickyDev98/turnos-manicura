# Levanta todo el sistema: docker compose up --build
#   Frontend: http://localhost:3000
#   Backend:  http://localhost:8080
#   MySQL:    localhost:3309 (usuario root, clave en .env)
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definí MYSQL_ROOT_PASSWORD en un archivo .env (copiá .env.example)}
      # Crea la base vacía; las tablas las crea Flyway desde el backend
      MYSQL_DATABASE: TURNOS
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP) y no el socket: el servidor temporal de arranque no acepta TCP,
      # así no se marca "healthy" antes de que termine la inicialización de MySQL
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?Definí MYSQL_ROOT_PASSWORD en un archivo .env (copiá .env.example)}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/TURNOS
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definí MYSQL_ROOT_PASSWORD en un archivo .env (copiá .env.example)}
      # Clave con la que se firman los tokens de sesión (JWT): al menos 32 caracteres. Ver .env.example
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en el archivo .env (copiá .env.example)}
      # Migraciones + datos de prueba (usuarios con clave 123456, etc.). Para una base real, dejar solo db/migration
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/datos-prueba
      # Avisos por mail: vacío = no se manda nada. Ver .env.example
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-turnos@manicura.local}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Casilla de correo de prueba: atrapa los mails sin mandarlos a nadie. Solo con: docker compose --profile correo up
  #   Bandeja: http://localhost:8025 (poné SMTP_HOST=mailpit y SMTP_PORT=1025 en .env)
  mailpit:
    image: axllent/mailpit
    profiles: ["correo"]
    ports:
      - "8025:8025"

volumes:
  mysql_data:
